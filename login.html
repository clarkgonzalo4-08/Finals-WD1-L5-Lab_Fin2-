<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GroceryKo | Log In</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="css folder/style.css">
</head>
<body>
    <main class="page">
        <h1 class="brand">GroceryKo</h1>
        <p class="tagline">Welcome back. Your list is waiting.</p>

        <!-- Login -->
        <section id="loginsection" class="card">
            <h2>Log in</h2>

            <label for="login_uname">Username</label>
            <input type="text" id="login_uname" autocomplete="username">

            <!-- Fixed: the original used the same id (login_uname) twice -->
            <label for="login_pword">Password</label>
            <input type="password" id="login_pword" autocomplete="current-password">

            <button type="button" onclick="loginUser()">Log In</button>
            <p id="logMessage" class="message" role="status"></p>

            <p class="switch">No account yet? <a href="register.html">Sign up</a></p>
        </section>
    </main>

    <!-- storage.js first: log.js depends on its helper functions -->
    <script src="js folder/storage.js"></script>
    <script src="js folder/log.js"></script>
</body>
</html>
